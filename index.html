<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Ads Banner</title>
    
    <!-- Image Preloading for Performance Optimization -->
    <link rel="preload" href="img/background.jpg" as="image" type="image/jpeg">
    <link rel="preload" href="img/logo.png" as="image" type="image/png">
    <link rel="preload" href="img/claim.png" as="image" type="image/png">
    <link rel="preload" href="img/burger.png" as="image" type="image/png">
    <link rel="preload" href="img/txt_1.png" as="image" type="image/png">
    <link rel="preload" href="img/txt_2.png" as="image" type="image/png">
    <link rel="preload" href="img/X.png" as="image" type="image/png">
    <link rel="preload" href="img/mce_treme.png" as="image" type="image/png">
    <link rel="preload" href="img/stroerer_cropped.png" as="image" type="image/png">
    <link rel="preload" href="img/logo.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="img/mcextreme.png" as="image" type="image/png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="banner-container">
            <!-- Background -->
            <div class="background"></div>
            
            <!-- Logo -->
            <div class="logo">
                <img src="img/logo.png" alt="McDonald's Logo">
            </div>

                <!-- Claim -->
            <div class="claim">
                <img src="img/claim.png" alt="Claim">
            </div>
            
            <!-- Burger -->
            <div class="burger">
                <img src="img/burger.png" alt="McDonald's Burger">
            </div>
            
            <!-- Text elements -->
            <div class="text-container">
                <div class="text-1">
                    <img src="img/txt_1.png" alt="Text 1">
                </div>
                <div class="text-2">
                    <img src="img/txt_2.png" alt="Text 2">
                </div>
            </div>

            <!-- Container for X-icon and text-->
            <div class="mcex-container">

                <!-- X logo -->
                <div class="x-icon">
                    <img src="img/X.png" alt="X">
                </div>
                
                <!-- MCExtreme -->
                <div class="mce-treme">
                    <img src="img/mce_treme.png" alt="MCExtreme">
                </div>

            </div>

            
            <!-- Stroerer -->
            <div class="stroerer">
                <img src="img/stroerer_cropped.png" alt="Stroerer">
            </div>
            
            <!-- Water Droplet Transition -->
            <div class="droplet-container">
                <div class="droplet droplet-1"></div>
                <div class="droplet droplet-2"></div>
                <div class="droplet droplet-3"></div>
                <div class="droplet droplet-4"></div>
            </div>

            <!-- Main Logo -->
            <div class="main-mcLogo">
                <img width="356" src="img/logo.svg" alt="">
            </div>

            <!-- Last Title -->
            <div class="last-mc-title">
                <img src="img/mcextreme.png" alt="">
            </div>
            </div>

            
          
    </div>
    
    <script src="script.js"></script>
</body>
</html>
